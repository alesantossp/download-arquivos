# fly.toml app configuration file generated for download-arquivos on 2026-11-11T21:10:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'download-arquivos'
primary_region = 'ams'

[build]
  dockerfile = 'cloud/Dockerfile'

[env]
  PORT = '10000'
  REEL_OUTPUT_DIR = '/tmp/reel'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
